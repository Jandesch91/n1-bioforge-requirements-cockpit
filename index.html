<meta charset="utf-8">
<title>N1 BioForge Requirements Cockpit</title>
<div id="n1bf-requirements-cockpit">
  <style>
    #n1bf-requirements-cockpit {
      color-scheme: light dark;
      --n1bf-bg: light-dark(#f4f7f5, #101713);
      --n1bf-surface: light-dark(#ffffff, #18221c);
      --n1bf-text: light-dark(#17211b, #edf5ef);
      --n1bf-muted: light-dark(#526258, #afbeb4);
      --n1bf-border: light-dark(#cad5ce, #3a4a40);
      --n1bf-green: light-dark(#d9f2e1, #163c24);
      --n1bf-green-edge: #1b7f3a;
      --n1bf-blue: light-dark(#dceeff, #153753);
      --n1bf-blue-edge: #1769aa;
      --n1bf-yellow: light-dark(#fff2bf, #493900);
      --n1bf-yellow-edge: #a66b00;
      --n1bf-red: light-dark(#fde2e1, #4b1d1a);
      --n1bf-red-edge: #b42318;
      --n1bf-grey: light-dark(#e9ecea, #2b332e);
      --n1bf-grey-edge: #667085;
      --n1bf-purple: light-dark(#eee5ff, #30234e);
      --n1bf-purple-edge: #6941c6;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--n1bf-bg);
      color: var(--n1bf-text);
      padding: 24px;
      min-height: 100%;
    }
    #n1bf-requirements-cockpit * { box-sizing: border-box; }
    #n1bf-requirements-cockpit .n1bf-shell { max-width: 1180px; margin: 0 auto; }
    #n1bf-requirements-cockpit h1 { font-size: clamp(1.55rem, 3vw, 2.25rem); margin: 0 0 6px; }
    #n1bf-requirements-cockpit h2 { font-size: 1.15rem; margin: 30px 0 12px; }
    #n1bf-requirements-cockpit p { line-height: 1.55; }
    #n1bf-requirements-cockpit .n1bf-meta { color: var(--n1bf-muted); margin: 0 0 18px; }
    #n1bf-requirements-cockpit .n1bf-here {
      background: var(--n1bf-yellow); border: 2px solid var(--n1bf-yellow-edge);
      border-radius: 12px; padding: 18px; margin: 18px 0 24px;
    }
    #n1bf-requirements-cockpit .n1bf-here strong { display: block; margin-bottom: 6px; }
    #n1bf-requirements-cockpit .n1bf-flow {
      display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px;
      max-width: 760px; margin: 0 auto;
    }
    #n1bf-requirements-cockpit .n1bf-phase {
      position: relative; padding: 16px 18px; border-radius: 10px;
      border: 2px solid var(--n1bf-border); background: var(--n1bf-surface);
    }
    #n1bf-requirements-cockpit .n1bf-phase:not(:last-child)::after {
      content: "↓"; position: absolute; left: 50%; bottom: -24px;
      transform: translateX(-50%); font-size: 22px; color: var(--n1bf-muted);
    }
    #n1bf-requirements-cockpit .n1bf-phase-title { font-weight: 750; }
    #n1bf-requirements-cockpit .n1bf-status { display: inline-block; margin-top: 7px; font-weight: 700; }
    #n1bf-requirements-cockpit .approved { border-color: var(--n1bf-green-edge); background: var(--n1bf-green); }
    #n1bf-requirements-cockpit .in_progress { border-color: var(--n1bf-blue-edge); background: var(--n1bf-blue); }
    #n1bf-requirements-cockpit .human_gate { border-color: var(--n1bf-yellow-edge); background: var(--n1bf-yellow); }
    #n1bf-requirements-cockpit .changes_required,
    #n1bf-requirements-cockpit .blocked { border-color: var(--n1bf-red-edge); background: var(--n1bf-red); }
    #n1bf-requirements-cockpit .not_started { border-color: var(--n1bf-grey-edge); background: var(--n1bf-grey); }
    #n1bf-requirements-cockpit .n1bf-review { box-shadow: inset 6px 0 0 var(--n1bf-purple-edge); }
    #n1bf-requirements-cockpit .n1bf-return {
      border: 2px dashed var(--n1bf-purple-edge); background: var(--n1bf-purple);
      border-radius: 10px; padding: 14px 18px; max-width: 760px; margin: 18px auto 0;
    }
    #n1bf-requirements-cockpit .n1bf-roadmap {
      display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px;
      max-width: 760px; margin: 0 auto;
    }
    #n1bf-requirements-cockpit .n1bf-roadmap-step {
      position: relative; padding: 14px 18px; border-radius: 10px;
      border: 2px solid var(--n1bf-border); background: var(--n1bf-surface);
    }
    #n1bf-requirements-cockpit .n1bf-roadmap-step:not(:last-child)::after {
      content: "↓"; position: absolute; left: 50%; bottom: -24px;
      transform: translateX(-50%); font-size: 22px; color: var(--n1bf-muted);
    }
    #n1bf-requirements-cockpit .n1bf-roadmap-title { font-weight: 750; }
    #n1bf-requirements-cockpit .n1bf-roadmap-current {
      border-width: 3px; text-align: center;
    }
    #n1bf-requirements-cockpit .n1bf-next { font-weight: 800; color: light-dark(#6b4700, #ffe28a); }
    #n1bf-requirements-cockpit .n1bf-controls {
      display: flex; flex-wrap: wrap; gap: 12px; align-items: end; margin: 12px 0 18px;
    }
    #n1bf-requirements-cockpit label { display: grid; gap: 5px; color: var(--n1bf-muted); font-size: .9rem; }
    #n1bf-requirements-cockpit select {
      min-width: 210px; padding: 9px 10px; border: 1px solid var(--n1bf-border);
      border-radius: 7px; background: var(--n1bf-surface); color: var(--n1bf-text);
    }
    #n1bf-requirements-cockpit .n1bf-count { color: var(--n1bf-muted); padding-bottom: 9px; }
    #n1bf-requirements-cockpit .n1bf-chunks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    #n1bf-requirements-cockpit .n1bf-chunk {
      border: 2px solid var(--n1bf-border); border-radius: 12px; padding: 16px;
      background: var(--n1bf-surface);
    }
    #n1bf-requirements-cockpit .n1bf-chunk h3 { font-size: 1rem; margin: 0 0 8px; }
    #n1bf-requirements-cockpit .n1bf-chunk p { margin: 7px 0; }
    #n1bf-requirements-cockpit .n1bf-chunk dl { display: grid; grid-template-columns: 128px 1fr; gap: 7px 12px; margin: 14px 0 0; }
    #n1bf-requirements-cockpit .n1bf-chunk dt { color: var(--n1bf-muted); font-weight: 650; }
    #n1bf-requirements-cockpit .n1bf-chunk dd { margin: 0; overflow-wrap: anywhere; }
    #n1bf-requirements-cockpit code { font-size: .85em; }
    #n1bf-requirements-cockpit details {
      margin-top: 24px; border: 1px solid var(--n1bf-border); border-radius: 10px;
      padding: 12px 14px; background: var(--n1bf-surface);
    }
    #n1bf-requirements-cockpit summary { cursor: pointer; font-weight: 700; }
    #n1bf-requirements-cockpit .n1bf-empty { grid-column: 1 / -1; color: var(--n1bf-muted); }
    @media (max-width: 760px) {
      #n1bf-requirements-cockpit { padding: 16px; }
      #n1bf-requirements-cockpit .n1bf-chunks { grid-template-columns: 1fr; }
      #n1bf-requirements-cockpit .n1bf-chunk dl { grid-template-columns: 1fr; gap: 3px; }
      #n1bf-requirements-cockpit .n1bf-chunk dd { margin-bottom: 7px; }
    }
  </style>

  <script>
    (() => {
      const root = document.getElementById("n1bf-requirements-cockpit");
      const data = JSON.parse(document.getElementById("n1bf-cockpit-data").textContent);
      const escapeText = value => String(value ?? "");
      const badge = status => {
        const item = data.status_definitions[status];
        return `${item.icon} ${item.label}`;
      };
      root.querySelector("h1").textContent = data.metadata.title;
      root.querySelector(".n1bf-meta").textContent = `${data.metadata.planning_branch} · ${data.metadata.input_sha.slice(0, 8)} · ${data.metadata.snapshot_date}`;
      const here = data.you_are_here;
      root.querySelector(".n1bf-here").classList.add(here.status);
      root.querySelector(".n1bf-here").innerHTML = `<strong id="n1bf-here-title">${badge(here.status)} — YOU ARE HERE</strong><div>${escapeText(here.title)}</div><p><b>Wat u nu doet:</b> ${escapeText(here.what_human_does_next)}</p><p><b>Volgende toegestane actie:</b> ${escapeText(here.next_allowed_action)}</p>`;

      const flow = root.querySelector(".n1bf-flow");
      data.phases.forEach(phase => {
        const node = document.createElement("section");
        node.className = `n1bf-phase ${phase.status}${phase.display_kind === "independent_review" ? " n1bf-review" : ""}`;
        node.innerHTML = `<div class="n1bf-phase-title">${escapeText(phase.number)} · ${escapeText(phase.role)}</div><div>${escapeText(phase.plain_language)}</div><span class="n1bf-status">${phase.display_kind === "independent_review" ? "🟣 " : ""}${badge(phase.status)}</span>`;
        flow.appendChild(node);
      });
      const review = data.phases.find(phase => phase.id === "phase-6");
      const target = data.phases.find(phase => phase.id === review.return_to_phase);
      root.querySelector(".n1bf-return").textContent = `↩ Bij CHANGES REQUIRED gaat een nieuwe verse taak terug naar de vroegste defecte fase. Huidige 06R-teruglus: ${target.number} · ${target.role}.`;

      const roadmap = root.querySelector(".n1bf-roadmap");
      const markerChunk = here.active_chunk || here.next_chunk;
      [...data.chunks].sort((a, b) => a.sequence - b.sequence).forEach(chunk => {
        if (chunk.id === markerChunk) {
          const marker = document.createElement("section");
          marker.className = `n1bf-roadmap-step n1bf-roadmap-current ${here.status}`;
          marker.innerHTML = `<div class="n1bf-roadmap-title">${data.status_definitions[here.status].icon} YOU ARE HERE</div><div>${here.active_chunk ? `Actief: ${escapeText(here.active_chunk)}` : "Geen requirementchunk actief"}</div><div>Volgende: <b>${escapeText(here.next_chunk)}</b></div>`;
          roadmap.appendChild(marker);
        }
        const step = document.createElement("section");
        step.className = `n1bf-roadmap-step ${chunk.status}`;
        const next = chunk.id === here.next_chunk ? '<span class="n1bf-next"> · ⏭ VOLGENDE</span>' : "";
        step.innerHTML = `<div class="n1bf-roadmap-title">${chunk.sequence} · ${escapeText(chunk.id)}${next}</div><div>${escapeText(chunk.plain_language)}</div><span class="n1bf-status">${badge(chunk.status)}</span>`;
        roadmap.appendChild(step);
      });

      const statusFilter = root.querySelector("#n1bf-status-filter");
      Object.entries(data.status_definitions).forEach(([key, item]) => {
        if (key === "independent_review") return;
        const option = document.createElement("option");
        option.value = key;
        option.textContent = `${item.icon} ${item.label}`;
        statusFilter.appendChild(option);
      });
      const phaseFilter = root.querySelector("#n1bf-phase-filter");
      data.phases.forEach(phase => {
        const option = document.createElement("option");
        option.value = phase.id;
        option.textContent = `${phase.number} · ${phase.role}`;
        phaseFilter.appendChild(option);
      });

      const chunks = root.querySelector(".n1bf-chunks");
      const renderChunks = () => {
        const selectedStatus = statusFilter.value;
        const selectedPhase = phaseFilter.value;
        const visible = [...data.chunks].sort((a, b) => a.sequence - b.sequence).filter(chunk =>
          (selectedStatus === "all" || chunk.status === selectedStatus) &&
          (selectedPhase === "all" || chunk.current_phase === selectedPhase)
        );
        chunks.replaceChildren();
        visible.forEach(chunk => {
          const phase = data.phases.find(item => item.id === chunk.current_phase);
          const card = document.createElement("article");
          card.className = `n1bf-chunk ${chunk.status}`;
          const task = chunk.responsible_task || "Nog geen verse taak";
          card.innerHTML = `<h3>${chunk.sequence} · ${badge(chunk.status)} · ${escapeText(chunk.id)} — ${escapeText(chunk.plain_language)}</h3>
            <p>${escapeText(chunk.visible_value)}</p>
            <dl>
              <dt>REQ-scope</dt><dd>${chunk.req_scope.map(item => `<code>${escapeText(item)}</code>`).join("<br>")}</dd>
              <dt>Huidige fase</dt><dd>${escapeText(phase.number)} · ${escapeText(phase.role)}</dd>
              <dt>Blocker</dt><dd>${escapeText(chunk.blocker)}</dd>
              <dt>Input-SHA</dt><dd><code>${escapeText(chunk.input_sha)}</code></dd>
              <dt>Output</dt><dd>${escapeText(chunk.output_handoff)}</dd>
              <dt>Rol / taak</dt><dd>${escapeText(chunk.responsible_role)} · ${escapeText(task)}</dd>
              <dt>Volgende actie</dt><dd>${escapeText(chunk.next_allowed_action)}</dd>
            </dl>`;
          chunks.appendChild(card);
        });
        if (!visible.length) {
          const empty = document.createElement("p");
          empty.className = "n1bf-empty";
          empty.textContent = "Geen chunks voldoen aan deze combinatie.";
          chunks.appendChild(empty);
        }
        root.querySelector(".n1bf-count").textContent = `${visible.length} van ${data.chunks.length} chunks`;
      };
      statusFilter.addEventListener("change", renderChunks);
      phaseFilter.addEventListener("change", renderChunks);
      renderChunks();

      root.querySelector(".n1bf-history").innerHTML = `<h3>Duurzame historie blijft behouden</h3><ul>${data.history.map(item => `<li><b>${escapeText(item.label)}</b> — ${escapeText(item.status)} — <code>${escapeText(item.handoff)}</code></li>`).join("")}</ul>`;
      const protocol = root.querySelector(".n1bf-protocol");
      data.orchestrator_protocol.forEach(rule => {
        const li = document.createElement("li");
        li.textContent = rule;
        protocol.appendChild(li);
      });
    })();
  </script>
</div>
